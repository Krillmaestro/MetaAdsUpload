name: Publish worker

# Safety net for Upload-to-Meta jobs: every five minutes, run any job that is
# due (queued, waiting for Meta to process a video, or retrying). The app
# normally finishes jobs itself within seconds; this catches anything a
# server restart or a closed tab left behind.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx --yes tsx@4 scripts/publish-worker.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
