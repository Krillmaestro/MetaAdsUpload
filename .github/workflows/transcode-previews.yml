name: Transcode creative previews

# Makes browser-playable 720p previews of the library masters in R2 so the
# Learning Loop can play a creative (with sound, full frame). See
# scripts/transcode-previews.mjs. Nightly + on demand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max masters per job"
        default: "40"
      shards:
        description: "Parallel jobs (backfill: 8)"
        default: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      total: ${{ steps.list.outputs.total }}
    steps:
      - id: list
        run: |
          n="${{ github.event.inputs.shards || '1' }}"
          echo "total=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 0 $((n - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  transcode:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # ubuntu-latest no longer ships ffmpeg; install it (about 30 s).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: ffmpeg -version
      - run: node scripts/transcode-previews.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
          SHARDS: ${{ needs.plan.outputs.total }}
          SHARD: ${{ matrix.shard }}
