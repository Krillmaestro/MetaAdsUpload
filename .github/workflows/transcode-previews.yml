name: Transcode creative previews

# Makes browser-playable 720p previews of the library masters in R2 so the
# Learning Loop can play a creative (with sound, full frame). See
# scripts/transcode-previews.mjs. Nightly + on demand.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max masters per run"
        default: "40"

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # ubuntu-latest no longer ships ffmpeg; install it (about 30 s).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: ffmpeg -version
      - run: node scripts/transcode-previews.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          LIMIT: ${{ github.event.inputs.limit || '40' }}
